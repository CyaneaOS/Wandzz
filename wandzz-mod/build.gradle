plugins {
    // Loom 1.17.x = stabilna linia dla MC 1.21.11 (nadal wersji zamaskowanej,
    // wiec zostaje przy "fabric-loom"; wariant bez remapowania
    // "net.fabricmc.fabric-loom" jest dopiero od 26.1).
    id 'fabric-loom' version "${project.loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom sam dodaje maven.fabricmc.net i biblioteki Mojang - tu tylko wlasne repo.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        wandzz {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Od 1.21.11 Fabric uzywa oficjalnych mapowan Mojanga (Yarn zostal wygaszony).
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    // Gradle 9: nie odpytujemy `project` w srodku konfiguracji taska.
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    // Zrodla sa ASCII, ale jawne ustawienie encodingu chroni przed
    // "unmappable character" na systemach z inna domyslna strona kodowa (Windows-1250).
    options.encoding = "UTF-8"
}

java {
    // Loom dolaczy sourcesJar do remapSourcesJar + taska "build".
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Repozytoria, do ktorych PUBLIKUJEMY (nie te, z ktorych sciagamy).
    }
}
